name: Ducelio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate formatting diff
        run: |
          npx prettier --write .
          git diff --exit-code

      - name: Run lint, typecheck, and tests
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build production app
        run: npm run build
